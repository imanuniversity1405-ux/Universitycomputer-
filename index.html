  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

2px; text-decoration: none; color: #0B1220\">\n<span dir=\"ltr\" style=\"width: 40px; height: 40px; border-radius: 10px; background: #0B1220; color: #7DD3FC; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 15px\">&lt;/&gt;<\u002Fspan>\n<span style=\"font-weight: 800; font-size: 20px\">کدلب<\u002Fspan>\n<\u002Fa>\n<nav aria-label=\"منوی اصلی\" style=\"display: flex; flex-wrap: wrap; gap: 0 24px\">\n<button type=\"button\" sc-camel-on-click=\"{{ open.lifecycle }}\" style=\"display: inline-flex; align-items: center; min-height: 44px; color: #334155; text-decoration: none; font-size: 15px; font-weight: 500; border: 0; background: transparent; font-family: inherit; cursor: pointer\">چرخه‌ی توسعه<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ open.fields }}\" style=\"display: inline-flex; align-items: center; min-height: 44px; color: #334155; text-decoration: none; font-size: 15px; font-weight: 500; border: 0; background: transparent; font-family: inherit; cursor: pointer\">حوزه‌ها<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ open.tools }}\" style=\"display: inline-flex; align-items: center; min-height: 44px; color: #334155; text-decoration: none; font-size: 15px; font-weight: 500; border: 0; background: transparent; font-family: inherit; cursor: pointer\">ابزارها<\u002Fbutton>\n<div style=\"position: relative\">\n<button type=\"button\" sc-camel-on-click=\"{{ toggleUni }}\" aria-expanded=\"{{ uni.open }}\" aria-haspopup=\"true\" style=\"display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0; border: 0; background: transparent; color: #334155; font-size: 15px; font-weight: 500; cursor: pointer\">دانشگاه<span aria-hidden=\"true\" style=\"display: inline-flex; transition: transform 0.25s ease; transform: {{uni.arrow}}\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 12 12\" fill=\"none\" stroke=\"#334155\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2.5 4.5L6 8L9.5 4.5\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fbutton>\n<div style=\"position: absolute; top: 100%; right: 0; z-index: 20; min-width: 260px; padding: 8px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #D5DCE6; border-radius: 12px; box-shadow: 0 12px 32px rgba(11, 18, 32, 0.14); transform-origin: top right; transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s; opacity: {{uni.o}}; transform: {{uni.t}}; visibility: {{uni.v}}\">\n<a class=\"uni-item\" href=\"#university\" sc-camel-on-click=\"{{ open.university }}\" style=\"display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #0B1220; text-decoration: none; font-size: 15px; font-weight: 500; transition: opacity 0.3s ease 0.05s, transform 0.3s ease 0.05s; opacity: {{uni.io}}; transform: {{uni.it}}\">دانشگاه باهنر زاهدان<\u002Fa>\n<a class=\"uni-item\" href=\"#university\" sc-camel-on-click=\"{{ open.university }}\" style=\"display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #0B1220; text-decoration: none; font-size: 15px; font-weight: 500; transition: opacity 0.3s ease 0.1s, transform 0.3s ease 0.1s; opacity: {{uni.io}}; transform: {{uni.it}}\">دانشگاه آزاد زاهدان<\u002Fa>\n<a class=\"uni-item\" href=\"#university\" sc-camel-on-click=\"{{ open.university }}\" style=\"display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #0B1220; text-decoration: none; font-size: 15px; font-weight: 500; transition: opacity 0.3s ease 0.15s, transform 0.3s ease 0.15s; opacity: {{uni.io}}; transform: {{uni.it}}\">دانشگاه آزاد زابل<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{ open.notes }}\" style=\"display: inline-flex; align-items: center; min-height: 44px; color: #334155; text-decoration: none; font-size: 15px; font-weight: 500; border: 0; background: transparent; font-family: inherit; cursor: pointer\">جزوات<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ open.projects }}\" style=\"display: inline-flex; align-items: center; min-height: 44px; color: #334155; text-decoration: none; font-size: 15px; font-weight: 500; border: 0; background: transparent; font-family: inherit; cursor: pointer\">پروژه<\u002Fbutton>\n<\u002Fnav>\n<\u002Fdiv>\n<\u002Fheader>\n\n<section class=\"hero\">\n<span class=\"fl f1\" dir=\"ltr\" aria-hidden=\"true\">∑<\u002Fspan><span class=\"fl f2\" dir=\"ltr\" aria-hidden=\"true\">O(n log n)<\u002Fspan><span class=\"fl f3\" dir=\"ltr\" aria-hidden=\"true\">λ<\u002Fspan><span class=\"fl f4\" dir=\"ltr\" aria-hidden=\"true\">∫ f(x)dx<\u002Fspan><span class=\"fl f5\" dir=\"ltr\" aria-hidden=\"true\">{ }<\u002Fspan>\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 72px 24px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 48px\">\n<div style=\"flex: 1 1 440px; min-width: 0\">\n<span style=\"display: inline-block; padding: 4px 16px; border: 1px solid #B8C4D6; border-radius: 999px; background: #FFFFFF; color: #334155; font-size: 14px; font-weight: 500\">علوم کامپیوتر · مهندسی نرم‌افزار<\u002Fspan>\n<h1 style=\"margin: 20px 0 16px; color: #FFFFFF; font-size: clamp(34px, 5vw, 56px); line-height: 1.4; font-weight: 800\">نرم‌افزار را مثل یک <span style=\"color: {{accent}}\">آزمایش علمی<\u002Fspan> بسازید<\u002Fh1>\n<p style=\"margin: 0 0 16px; max-width: 540px; font-size: 17px; color: #D5E2F5\">مهندسی کامپیوتر گرایش مهندسی نرم‌افزار رشته‌ای است که روی تحلیل، طراحی، پیاده‌سازی، آزمون و نگهداری سیستم‌های نرم‌افزاری بزرگ و قابل‌اعتماد تمرکز دارد.<\u002Fp>\n<p style=\"margin: 0 0 28px; max-width: 540px; font-size: 16px; color: #A9BBD6\">دانشجوی این رشته در کنار ریاضیات گسسته، ساختمان داده، الگوریتم، پایگاه داده، سیستم‌عامل و شبکه، با مهندسی نیازمندی‌ها، معماری و الگوهای طراحی، مدیریت پروژه و تضمین کیفیت آشنا می‌شود. فارغ‌التحصیلان در توسعه‌ی وب و موبایل، هوش مصنوعی، امنیت، DevOps و مدیریت محصول مشغول به کار می‌شوند.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px\">\n<button type=\"button\" sc-camel-on-click=\"{{ open.fields }}\" style=\"display: inline-flex; align-items: center; min-height: 48px; padding: 0 24px; border-radius: 10px; background: #FFFFFF; color: #0B1220; border: 1px solid #B8C4D6; text-decoration: none; font-weight: 700; font-family: inherit; font-size: 16px; cursor: pointer\">کاوش در حوزه‌ها<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px; margin-top: 28px\">\n<span style=\"padding: 2px 12px; border: 1px solid #B8C4D6; border-radius: 6px; background: #FFFFFF; font-size: 14px; color: #334155\">کارشناسی ۴ ساله<\u002Fspan>\n<span style=\"padding: 2px 12px; border: 1px solid #B8C4D6; border-radius: 6px; background: #FFFFFF; font-size: 14px; color: #334155\">معماری نرم‌افزار<\u002Fspan>\n<span style=\"padding: 2px 12px; border: 1px solid #B8C4D6; border-radius: 6px; background: #FFFFFF; font-size: 14px; color: #334155\">آزمون و کیفیت<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<figure style=\"margin: 0; flex: 1 1 460px; min-width: 0\">\n<div style=\"background: #0B1220; border: 1px solid #1E293B; border-radius: 14px; overflow: hidden\">\n<div dir=\"ltr\" style=\"display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-bottom: 1px solid #1E293B; font-family: 'JetBrains Mono', monospace; font-size: 13px\">\n<span style=\"color: #9FB0C8\">binary_search.py<\u002Fspan>\n<span style=\"color: #7DD3FC; font-weight: 700\">O(log n)<\u002Fspan>\n<\u002Fdiv>\n<pre dir=\"ltr\" style=\"margin: 0; padding: 20px; overflow-x: auto; text-align: left; white-space: pre; font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1.75; color: #E5E9F0\"><span style=\"color: #7DD3FC\">def<\u002Fspan> <span style=\"color: #FCD34D\">binary_search<\u002Fspan>(items, target):\n    lo, hi = <span style=\"color: #FDBA74\">0<\u002Fspan>, len(items) - <span style=\"color: #FDBA74\">1<\u002Fspan>\n    <span style=\"color: #7DD3FC\">while<\u002Fspan> lo &lt;= hi:\n        mid = (lo + hi) // <span style=\"color: #FDBA74\">2<\u002Fspan>\n        <span style=\"color: #7DD3FC\">if<\u002Fspan> items[mid] == target:\n            <span style=\"color: #7DD3FC\">return<\u002Fspan> mid\n        <span style=\"color: #7DD3FC\">if<\u002Fspan> items[mid] &lt; target:\n            lo = mid + <span style=\"color: #FDBA74\">1<\u002Fspan>\n        <span style=\"color: #7DD3FC\">else<\u002Fspan>:\n            hi = mid - <span style=\"color: #FDBA74\">1<\u002Fspan>\n    <span style=\"color: #7DD3FC\">return<\u002Fspan> -<span style=\"color: #FDBA74\">1<\u002Fspan><\u002Fpre>\n<\u002Fdiv>\n\n<\u002Ffigure>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n\n\n\n\n\n\n\n\n\n\n\n<section id=\"windows\" class=\"launch\"><div style=\"max-width: 1200px; margin: 0 auto; padding: 64px 24px; box-sizing: border-box\">\n<span style=\"font-size: 14px; font-weight: 700; color: {{accent}}\">پنجره‌ها<\u002Fspan>\n<h2 style=\"margin: 8px 0 28px; font-size: 32px; font-weight: 800\">هر سربرگ، یک پنجره‌ی مستقل<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px\">\n<sc-for list=\"{{ wins }}\" as=\"w\" hint-placeholder-count=\"6\"><button type=\"button\" class=\"wcard\" sc-camel-on-click=\"{{ w.open }}\"><span class=\"wi\" dir=\"ltr\">{{w.icon}}<\u002Fspan><b>{{w.title}}<\u002Fb><small>{{w.desc}}<\u002Fsmall><\u002Fbutton><\u002Fsc-for>\n<\u002Fdiv><\u002Fdiv><\u002Fsection>\n<section style=\"background: #0B1220; color: #F4F6F9\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 64px 24px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px 48px\">\n<div style=\"flex: 1 1 400px; min-width: 0\">\n<h2 style=\"margin: 0 0 8px; font-size: 32px; line-height: 1.5; font-weight: 800\">از یک مسئله‌ی کوچک شروع کنید<\u002Fh2>\n<p style=\"margin: 0; font-size: 17px; color: #C5CEDC\">مفاهیم را بخوانید، کد بنویسید، اندازه بگیرید و دوباره تکرار کنید.<\u002Fp>\n<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{ open.lifecycle }}\" style=\"display: inline-flex; align-items: center; min-height: 48px; padding: 0 28px; border-radius: 10px; background: #FFFFFF; color: #0B1220; text-decoration: none; font-weight: 700; border: 0; font-family: inherit; font-size: 16px; cursor: pointer\">مرور چرخه‌ی توسعه<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"background: #FFFFFF; border-top: 1px solid #D5DCE6\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 24px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; font-size: 14px; color: #475569\">\n<span>کدلب · مرجع فارسی علوم کامپیوتر و مهندسی نرم‌افزار<\u002Fspan>\n<div style=\"display: flex; flex-wrap: wrap; gap: 0 20px\">\n<button type=\"button\" sc-camel-on-click=\"{{ open.lifecycle }}\" style=\"display: inline-flex; align-items: center; min-height: 44px; color: #334155; text-decoration: none; border: 0; background: transparent; font-family: inherit; cursor: pointer\">چرخه‌ی توسعه<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ open.fields }}\" style=\"display: inline-flex; align-items: center; min-height: 44px; color: #334155; text-decoration: none; border: 0; background: transparent; font-family: inherit; cursor: pointer\">حوزه‌ها<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ open.tools }}\" style=\"display: inline-flex; align-items: center; min-height: 44px; color: #334155; text-decoration: none; border: 0; background: transparent; font-family: inherit; cursor: pointer\">ابزارها<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<sc-if value=\"{{ win.lifecycle }}\"><div class=\"ov\" sc-camel-on-click=\"{{ close }}\"><div class=\"panel\" role=\"dialog\" aria-modal=\"true\" aria-label=\"چرخه‌ی توسعه\"><div class=\"ph\"><span>چرخه‌ی توسعه<\u002Fspan><button type=\"button\" class=\"x\" sc-camel-on-click=\"{{ closeBtn }}\" aria-label=\"بستن\">×<\u002Fbutton><\u002Fdiv><section id=\"lifecycle\" style=\"background: #FFFFFF; border-bottom: 1px solid #D5DCE6\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 72px 24px; box-sizing: border-box\">\n<span style=\"font-size: 14px; font-weight: 700; color: {{accent}}\">بخش ۱ · روش<\u002Fspan>\n<h2 style=\"margin: 8px 0 12px; font-size: 36px; line-height: 1.5; font-weight: 800\">چرخه‌ی توسعه به‌مثابه‌ی روش علمی<\u002Fh2>\n<p style=\"margin: 0 0 40px; max-width: 640px; font-size: 17px; color: #334155\">هر پروژه‌ی نرم‌افزاری پنج گام تکرارشونده دارد. هر گام معادلی در روش علمی دارد و خروجی‌اش را می‌توان سنجید.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px\">\n<div style=\"padding: 24px; border: 1px solid #D5DCE6; border-radius: 14px; background: #F4F6F9\">\n<div style=\"font-size: 32px; font-weight: 800; color: #0B1220; line-height: 1.3\">۱<\u002Fdiv>\n<h3 style=\"margin: 12px 0 4px; font-size: 18px; font-weight: 700\">تحلیل نیازمندی<\u002Fh3>\n<div style=\"font-size: 13px; font-weight: 700; color: #0F766E\">معادل علمی: مشاهده<\u002Fdiv>\n<p style=\"margin: 12px 0 0; font-size: 15px; color: #334155\">مسئله را دقیق تعریف کنید و معیار موفقیت را بنویسید.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding: 24px; border: 1px solid #D5DCE6; border-radius: 14px; background: #F4F6F9\">\n<div style=\"font-size: 32px; font-weight: 800; color: #0B1220; line-height: 1.3\">۲<\u002Fdiv>\n<h3 style=\"margin: 12px 0 4px; font-size: 18px; font-weight: 700\">طراحی<\u002Fh3>\n<div style=\"font-size: 13px; font-weight: 700; color: #0F766E\">معادل علمی: فرضیه<\u002Fdiv>\n<p style=\"margin: 12px 0 0; font-size: 15px; color: #334155\">معماری، مدل داده و رابط‌ها را به‌عنوان یک فرضیه‌ی قابل‌آزمون طرح کنید.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding: 24px; border: 1px solid #D5DCE6; border-radius: 14px; background: #F4F6F9\">\n<div style=\"font-size: 32px; font-weight: 800; color: #0B1220; line-height: 1.3\">۳<\u002Fdiv>\n<h3 style=\"margin: 12px 0 4px; font-size: 18px; font-weight: 700\">پیاده‌سازی<\u002Fh3>\n<div style=\"font-size: 13px; font-weight: 700; color: #0F766E\">معادل علمی: آزمایش<\u002Fdiv>\n<p style=\"margin: 12px 0 0; font-size: 15px; color: #334155\">طرح را در قالب کدی خوانا و ماژولار اجرا کنید.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding: 24px; border: 1px solid #D5DCE6; border-radius: 14px; background: #F4F6F9\">\n<div style=\"font-size: 32px; font-weight: 800; color: #0B1220; line-height: 1.3\">۴<\u002Fdiv>\n<h3 style=\"margin: 12px 0 4px; font-size: 18px; font-weight: 700\">آزمون<\u002Fh3>\n<div style=\"font-size: 13px; font-weight: 700; color: #0F766E\">معادل علمی: اعتبارسنجی<\u002Fdiv>\n<p style=\"margin: 12px 0 0; font-size: 15px; color: #334155\">با آزمون واحد و یکپارچه، رفتار واقعی را با رفتار مورد انتظار مقایسه کنید.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding: 24px; border: 1px solid #D5DCE6; border-radius: 14px; background: #F4F6F9\">\n<div style=\"font-size: 32px; font-weight: 800; color: #0B1220; line-height: 1.3\">۵<\u002Fdiv>\n<h3 style=\"margin: 12px 0 4px; font-size: 18px; font-weight: 700\">استقرار و پایش<\u002Fh3>\n<div style=\"font-size: 13px; font-weight: 700; color: #0F766E\">معادل علمی: تکرار<\u002Fdiv>\n<p style=\"margin: 12px 0 0; font-size: 15px; color: #334155\">از محیط واقعی بازخورد بگیرید و چرخه را دوباره آغاز کنید.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection><\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{ win.fields }}\"><div class=\"ov\" sc-camel-on-click=\"{{ close }}\"><div class=\"panel\" role=\"dialog\" aria-modal=\"true\" aria-label=\"حوزه‌ها\"><div class=\"ph\"><span>حوزه‌ها<\u002Fspan><button type=\"button\" class=\"x\" sc-camel-on-click=\"{{ closeBtn }}\" aria-label=\"بستن\">×<\u002Fbutton><\u002Fdiv><section id=\"fields\" style=\"background: #FFFFFF; border-bottom: 1px solid #D5DCE6\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 72px 24px; box-sizing: border-box\">\n<span style=\"font-size: 14px; font-weight: 700; color: {{accent}}\">بخش ۳ · حوزه‌ها<\u002Fspan>\n<h2 style=\"margin: 8px 0 12px; font-size: 36px; line-height: 1.5; font-weight: 800\">حوزه‌های تخصصی توسعه‌ی نرم‌افزار<\u002Fh2>\n<p style=\"margin: 0 0 40px; max-width: 640px; font-size: 17px; color: #334155\">شش شاخه‌ی اصلی که بیشتر مسیرهای حرفه‌ای در مهندسی نرم‌افزار از آن‌ها می‌گذرد.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px\">\n<div style=\"padding: 28px; border: 1px solid #D5DCE6; border-radius: 14px; background: #F4F6F9\">\n<div dir=\"ltr\" style=\"width: 48px; height: 48px; border-radius: 10px; background: #0B1220; color: #7DD3FC; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 16px\">&lt;/&gt;<\u002Fdiv>\n<h3 style=\"margin: 20px 0 8px; font-size: 20px; font-weight: 700\">توسعه‌ی وب<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #334155\">معماری کلاینت–سرور، پروتکل HTTP، رابط‌های برنامه‌نویسی و تجربه‌ی کاربری.<\u002Fp>\n<span dir=\"ltr\" style=\"display: inline-block; margin-top: 16px; padding: 2px 10px; border: 1px solid #B8C4D6; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #475569\">HTTP · REST · UI<\u002Fspan>\n<\u002Fdiv>\n<div style=\"padding: 28px; border: 1px solid #D5DCE6; border-radius: 14px; background: #F4F6F9\">\n<div dir=\"ltr\" style=\"width: 48px; height: 48px; border-radius: 10px; background: #0B1220; color: #7DD3FC; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 20px\">∑<\u002Fdiv>\n<h3 style=\"margin: 20px 0 8px; font-size: 20px; font-weight: 700\">هوش مصنوعی و یادگیری ماشین<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #334155\">مدل‌های آماری و شبکه‌های عصبی؛ مسیر داده تا پیش‌بینی.<\u002Fp>\n<span dir=\"ltr\" style=\"display: inline-block; margin-top: 16px; padding: 2px 10px; border: 1px solid #B8C4D6; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #475569\">ML · Statistics<\u002Fspan>\n<\u002Fdiv>\n<div style=\"padding: 28px; border: 1px solid #D5DCE6; border-radius: 14px; background: #F4F6F9\">\n<div dir=\"ltr\" style=\"width: 48px; height: 48px; border-radius: 10px; background: #0B1220; color: #7DD3FC; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 18px\">#!<\u002Fdiv>\n<h3 style=\"margin: 20px 0 8px; font-size: 20px; font-weight: 700\">امنیت سایبری<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #334155\">رمزنگاری، احراز هویت و طراحی سیستم‌هایی که در برابر حمله مقاوم‌اند.<\u002Fp>\n<span dir=\"ltr\" style=\"display: inline-block; margin-top: 16px; padding: 2px 10px; border: 1px solid #B8C4D6; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #475569\">Crypto · Auth<\u002Fspan>\n<\u002Fdiv>\n<div style=\"padding: 28px; border: 1px solid #D5DCE6; border-radius: 14px; background: #F4F6F9\">\n<div dir=\"ltr\" style=\"width: 48px; height: 48px; border-radius: 10px; background: #0B1220; color: #7DD3FC; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 18px\">{ }<\u002Fdiv>\n<h3 style=\"margin: 20px 0 8px; font-size: 20px; font-weight: 700\">پایگاه داده<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #334155\">مدل‌سازی داده، نمایه‌گذاری، تراکنش‌ها و بازیابی کارآمد اطلاعات.<\u002Fp>\n<span dir=\"ltr\" style=\"display: inline-block; margin-top: 16px; padding: 2px 10px; border: 1px solid #B8C4D6; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #475569\">SQL · Indexing<\u002Fspan>\n<\u002Fdiv>\n<div style=\"padding: 28px; border: 1px solid #D5DCE6; border-radius: 14px; background: #F4F6F9\">\n<div dir=\"ltr\" style=\"width: 48px; height: 48px; border-radius: 10px; background: #0B1220; color: #7DD3FC; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 20px\">⇄<\u002Fdiv>\n<h3 style=\"margin: 20px 0 8px; font-size: 20px; font-weight: 700\">سیستم‌های توزیع‌شده<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #334155\">همروندی، همگام‌سازی و تحمل‌پذیری خطا در شبکه‌ای از ماشین‌ها.<\u002Fp>\n<span dir=\"ltr\" style=\"display: inline-block; margin-top: 16px; padding: 2px 10px; border: 1px solid #B8C4D6; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #475569\">Consensus · Scale<\u002Fspan>\n<\u002Fdiv>\n<div style=\"padding: 28px; border: 1px solid #D5DCE6; border-radius: 14px; background: #F4F6F9\">\n<div dir=\"ltr\" style=\"width: 48px; height: 48px; border-radius: 10px; background: #0B1220; color: #7DD3FC; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 22px\">∞<\u002Fdiv>\n<h3 style=\"margin: 20px 0 8px; font-size: 20px; font-weight: 700\">DevOps<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #334155\">یکپارچه‌سازی و تحویل مداوم، زیرساخت به‌صورت کد و پایش سرویس‌ها.<\u002Fp>\n<span dir=\"ltr\" style=\"display: inline-block; margin-top: 16px; padding: 2px 10px; border: 1px solid #B8C4D6; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #475569\">CI/CD · IaC<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection><\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{ win.tools }}\"><div class=\"ov\" sc-camel-on-click=\"{{ close }}\"><div class=\"panel\" role=\"dialog\" aria-modal=\"true\" aria-label=\"ابزارها\"><div class=\"ph\"><span>ابزارها<\u002Fspan><button type=\"button\" class=\"x\" sc-camel-on-click=\"{{ closeBtn }}\" aria-label=\"بستن\">×<\u002Fbutton><\u002Fdiv><section id=\"tools\" style=\"background: #F4F6F9; border-bottom: 1px solid #D5DCE6\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 72px 24px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 48px\">\n<div style=\"flex: 1 1 360px; min-width: 0\">\n<span style=\"font-size: 14px; font-weight: 700; color: {{accent}}\">بخش ۴ · ابزارها<\u002Fspan>\n<h2 style=\"margin: 8px 0 12px; font-size: 36px; line-height: 1.5; font-weight: 800\">جعبه‌ابزار آزمایشگاه<\u002Fh2>\n<p style=\"margin: 0 0 24px; font-size: 17px; color: #334155\">زبان‌ها و ابزارهایی که تقریباً در هر پروژه‌ی حرفه‌ای با آن‌ها سروکار دارید.<\u002Fp>\n<div dir=\"ltr\" style=\"display: flex; flex-wrap: wrap; gap: 12px; justify-content: flex-end\">\n<span style=\"padding: 8px 18px; border: 1px solid #B8C4D6; border-radius: 10px; background: #FFFFFF; font-family: 'JetBrains Mono', monospace; font-size: 15px\">Git<\u002Fspan>\n<span style=\"padding: 8px 18px; border: 1px solid #B8C4D6; border-radius: 10px; background: #FFFFFF; font-family: 'JetBrains Mono', monospace; font-size: 15px\">Python<\u002Fspan>\n<span style=\"padding: 8px 18px; border: 1px solid #B8C4D6; border-radius: 10px; background: #FFFFFF; font-family: 'JetBrains Mono', monospace; font-size: 15px\">TypeScript<\u002Fspan>\n<span style=\"padding: 8px 18px; border: 1px solid #B8C4D6; border-radius: 10px; background: #FFFFFF; font-family: 'JetBrains Mono', monospace; font-size: 15px\">Rust<\u002Fspan>\n<span style=\"padding: 8px 18px; border: 1px solid #B8C4D6; border-radius: 10px; background: #FFFFFF; font-family: 'JetBrains Mono', monospace; font-size: 15px\">Docker<\u002Fspan>\n<span style=\"padding: 8px 18px; border: 1px solid #B8C4D6; border-radius: 10px; background: #FFFFFF; font-family: 'JetBrains Mono', monospace; font-size: 15px\">PostgreSQL<\u002Fspan>\n<span style=\"padding: 8px 18px; border: 1px solid #B8C4D6; border-radius: 10px; background: #FFFFFF; font-family: 'JetBrains Mono', monospace; font-size: 15px\">Linux<\u002Fspan>\n<span style=\"padding: 8px 18px; border: 1px solid #B8C4D6; border-radius: 10px; background: #FFFFFF; font-family: 'JetBrains Mono', monospace; font-size: 15px\">Kubernetes<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<figure style=\"margin: 0; flex: 1 1 400px; min-width: 0\">\n<div style=\"background: #0B1220; border: 1px solid #1E293B; border-radius: 14px; overflow: hidden\">\n<pre dir=\"ltr\" style=\"margin: 0; padding: 20px; overflow-x: auto; text-align: left; white-space: pre; font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1.9; color: #E5E9F0\"><span style=\"color: #86EFAC\">$<\u002Fspan> git switch -c feature/search\n<span style=\"color: #86EFAC\">$<\u002Fspan> pytest -q\n<span style=\"color: #86EFAC\">$<\u002Fspan> git commit -m <span style=\"color: #FCD34D\">\"feat: add binary search\"<\u002Fspan>\n<span style=\"color: #86EFAC\">$<\u002Fspan> git push origin feature/search<\u002Fpre>\n<\u002Fdiv>\n<figcaption style=\"padding-top: 12px; font-size: 14px; color: #475569\">شکل ۲ — یک چرخه‌ی کوتاه: شاخه‌ی تازه، آزمون، ثبت تغییر و ارسال.<\u002Ffigcaption>\n<\u002Ffigure>\n<\u002Fdiv>\n<\u002Fsection><\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{ win.university }}\"><div class=\"ov\" sc-camel-on-click=\"{{ close }}\"><div class=\"panel\" role=\"dialog\" aria-modal=\"true\" aria-label=\"دانشگاه\"><div class=\"ph\"><span>دانشگاه<\u002Fspan><button type=\"button\" class=\"x\" sc-camel-on-click=\"{{ closeBtn }}\" aria-label=\"بستن\">×<\u002Fbutton><\u002Fdiv><section id=\"university\" style=\"background: #FFFFFF; border-bottom: 1px solid #D5DCE6\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 72px 24px; box-sizing: border-box\">\n<span style=\"font-size: 14px; font-weight: 700; color: {{accent}}\">بخش ۵ · دانشگاه<\u002Fspan>\n<h2 style=\"margin: 8px 0 12px; font-size: 36px; line-height: 1.5; font-weight: 800\">دانشگاه‌ها<\u002Fh2>\n<p style=\"margin: 0 0 40px; max-width: 640px; font-size: 17px; color: #334155\">مراکز آموزشی که مسیر یادگیری علوم کامپیوتر و مهندسی نرم‌افزار را در آن‌ها دنبال می‌کنیم.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px\">\n<sc-for list=\"{{ unis }}\" as=\"u\" hint-placeholder-count=\"3\">\n<div style=\"padding: 28px; border: 1px solid #D5DCE6; border-radius: 14px; background: #F4F6F9; display: flex; flex-direction: column; gap: 12px\">\n<span style=\"font-size: 13px; font-weight: 700; color: #0F766E\">{{u.city}}<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 20px; font-weight: 700\">{{u.name}}<\u002Fh3>\n<div style=\"display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #334155\"><span>دانشجویان مهندسی نرم‌افزار<\u002Fspan><span style=\"font-weight: 700\">{{u.count}} از ۴۲<\u002Fspan><\u002Fdiv>\n<div style=\"height: 8px; border-radius: 4px; background: #E4E9F0; overflow: hidden\"><div style=\"height: 8px; background: {{u.barColor}}; width: {{u.pct}}\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; gap: 8px\">\n<input type=\"text\" value=\"{{u.draft}}\" sc-camel-on-input=\"{{ u.onInput }}\" placeholder=\"نام دانشجو\" aria-label=\"نام دانشجو\" maxlength=\"60\" style=\"flex: 1; min-width: 0; min-height: 44px; padding: 0 12px; border: 1px solid #B8C4D6; border-radius: 10px; background: #FFFFFF; font-family: inherit; font-size: 15px; box-sizing: border-box\">\n<button type=\"button\" sc-camel-on-click=\"{{ u.add }}\" disabled=\"{{u.full}}\" style=\"min-height: 44px; padding: 0 16px; border: 0; border-radius: 10px; background: {{u.btnBg}}; color: #FFFFFF; font-weight: 700; font-size: 15px; cursor: pointer\">افزودن<\u002Fbutton>\n<\u002Fdiv>\n<sc-if value=\"{{ u.isFull }}\"><p style=\"margin: 0; font-size: 14px; color: #B45309\">ظرفیت ۴۲ نفره‌ی این دانشگاه تکمیل شده است.<\u002Fp><\u002Fsc-if>\n<ol style=\"margin: 0; padding: 0 20px 0 0; display: flex; flex-direction: column; gap: 4px; max-height: 260px; overflow-y: auto; font-size: 15px\">\n<sc-for list=\"{{ u.students }}\" as=\"s\" hint-placeholder-count=\"0\">\n<li><span style=\"display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; width: calc(100% - 4px)\"><span>{{s.name}}<\u002Fspan><button type=\"button\" sc-camel-on-click=\"{{ s.remove }}\" aria-label=\"حذف {{s.name}}\" style=\"min-width: 32px; min-height: 32px; border: 0; background: transparent; color: #B91C1C; font-size: 18px; cursor: pointer\">×<\u002Fbutton><\u002Fspan><\u002Fli>\n<\u002Fsc-for>\n<\u002Fol>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection><\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{ win.notes }}\"><div class=\"ov\" sc-camel-on-click=\"{{ close }}\"><div class=\"panel\" role=\"dialog\" aria-modal=\"true\" aria-label=\"جزوات\"><div class=\"ph\"><span>جزوات<\u002Fspan><button type=\"button\" class=\"x\" sc-camel-on-click=\"{{ closeBtn }}\" aria-label=\"بستن\">×<\u002Fbutton><\u002Fdiv><section id=\"notes\" style=\"background: #F4F6F9; border-bottom: 1px solid #D5DCE6\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 72px 24px; box-sizing: border-box\">\n<span style=\"font-size: 14px; font-weight: 700; color: {{accent}}\">بخش ۶ · جزوات<\u002Fspan>\n<h2 style=\"margin: 8px 0 12px; font-size: 36px; line-height: 1.5; font-weight: 800\">جزوات درسی<\u002Fh2>\n<p style=\"margin: 0 0 40px; max-width: 640px; font-size: 17px; color: #334155\">خلاصه‌ی درس‌ها و منابع مطالعه‌ی دوره‌های علوم کامپیوتر.<\u002Fp>\n<div class=\"upl\"><label class=\"drop\"><input class=\"sr\" type=\"file\" multiple sc-camel-on-change=\"{{ notesUp.pick }}\"><span class=\"plus\">＋<\u002Fspan><span><b>بارگذاری جزوه<\u002Fb><br><small>PDF، Word، PowerPoint، تصویر و هر فایل دیگر<\u002Fsmall><\u002Fspan><\u002Flabel>\n<sc-if value=\"{{ notesUp.empty }}\"><p class=\"muted\">هنوز فایلی بارگذاری نشده است.<\u002Fp><\u002Fsc-if>\n<ul class=\"flist\"><sc-for list=\"{{ notesUp.files }}\" a s=\"ab\" sc-camel-on-click=\"{{ f.download }}\">دریافت<\u002Fbutton><button type=\"button\" class=\"ab del\" aria-label=\"حذف {{f.name}}\" sc-camel-on-click=\"{{ f.remove }}\">×<\u002Fbutton><\u002Fli><\u002Fsc-for><\u002Ful><\u002Fdiv>\n<div id=\"contact\" style=\"margin-top: 32px; padding: 28px; border: 1px solid #B8C4D6; border-radius: 14px; background: #FFFFFF; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 32px\">\n<div style=\"flex: 1 1 320px; min-width: 0\">\n<span style=\"font-size: 13px; font-weight: 700; color: #0F766E\">پروژه<\u002Fspan>\n<h3 style=\"margin: 8px 0; font-size: 22px; font-weight: 700\">ارتباط با استاد<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #334155\">برای مشاوره‌ی پروژه، پرسش درباره‌ی درس‌ها و هماهنگی، از طریق پیام‌رسان بله با استاد در ارتباط باشید.<\u002Fp>\n<\u002Fdiv>\n<a href=\"https://ble.ir/dr_mortezamiri\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display: inline-flex; align-items: center; min-height: 48px; padding: 0 28px; border-radius: 10px; background: {{accent}}; color: #FFFFFF; text-decoration: none; font-weight: 700\">ارتباط با استاد در بله<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection><\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1D4ED8&quot;,&quot;options&quot;:[&quot;#1D4ED8&quot;,&quot;#0F766E&quot;,&quot;#7C3AED&quot;,&quot;#B45309&quot;]},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:4700}}\">\nclass Component extends DCLogic {\nrenderVals() {\nconst n = 1000;\nconst accent = this.props.accent ?? '#1D4ED8';\nconst fmt = (v) => Math.round(v).toLocaleString('fa-IR');\nconst lg = Math.log2(n);\nconst max = n * n;\nconst w = (v) => Math.max(3, (Math.log10(v + 1) / Math.log10(max + 1)) * 100).toFixed(1) + '%';\nconst sizes = [10, 100, 1000, 1000000];\nconst winId = (this.state && this.state.win) || null;\nconst ids = ['lifecycle', 'fields', 'tools', 'university', 'notes', 'projects'];\nconst open = {}; const win = {};\nids.forEach((k) => { open[k] = () => this.setState({ win: k, uniOpen: false }); win[k] = winId === k; });\nconst ups = (this.state && this.state.ups) || { notes: [], proj: [] };\nconst kb = (b) => b < 1048576 ? Math.max(1, Math.round(b / 1024)) + ' KB' : (b / 1048576).toFixed(1) + ' MB';\nconst mkUp = (key) => { const list = ups[key] || []; return {\nempty: list.length === 0,\npick: (e) => { const fs = Array.from(e.target.files || []); e.target.value = ''; if (!fs.length) return; const cur = (this.state && this.state.ups) || { notes: [], proj: [] }; this.setState({ ups: { ...cur, [key]: [...(cur[key] || []), ...fs] } }); },\nfiles: list.map((f, i) => ({ name: f.name, size: kb(f.size),\ndownload: () => { const u = URL.createObjectURL(f); const a = document.createElement('a'); a.href = u; a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); },\nremove: () => this.setState({ ups: { ...ups, [key]: list.filter((_, j) => j !== i) } }) })) }; };\nconst wDefs = [['lifecycle', '⟳', 'چرخه‌ی توسعه', 'پنج گام تکرارشونده‌ی روش علمی در نرم‌افزار'], ['fields', '{ }', 'حوزه‌ها', 'شش شاخه‌ی تخصصی مهندسی نرم‌افزار'], ['tools', '$_', 'ابزارها', 'جعبه‌ابزار زبان‌ها و فناوری‌ها'], ['university', '🎓', 'دانشگاه', 'دانشجویان هر دانشگاه (تا ۴۲ نفر)'], ['notes', '≡', 'جزوات', 'بارگذاری و دریافت جزوه‌ها'], ['projects', '<\u002F>', 'پروژه', 'بارگذاری پروژه و ارتباط با استاد']];\nconst uniIsOpen = !!(this.state && this.state.uniOpen);\nconst MAX = 42;\nconst UNIS = [{ id: 'bahonar', name: 'دانشگاه باهنر زاهدان', city: 'زاهدان' }, { id: 'azad-zahedan', name: 'دانشگاه آزاد زاهدان', city: 'زاهدان' }, { id: 'azad-zabol', name: 'دانشگاه آزاد زابل', city: 'زابل' }];\nlet saved = {};\ntry { saved = JSON.parse(localStorage.getItem('kodlab_students') || '{}') || {}; } catch (e) { saved = {}; }\nconst students = (this.state && this.state.students) || saved;\nconst drafts = (this.state && this.state.drafts) || {};\nconst persist = (next) => { try { localStorage.setItem('kodlab_students', JSON.stringify(next)); } catch (e) {} };\nconst unis = UNIS.map((u) => {\nconst list = students[u.id] || [];\nconst full = list.length >= MAX;\nconst add = () => {\nconst name = String(drafts[u.id] || '').trim();\nconst cur = (this.state && this.state.students) || saved;\nconst arr = cur[u.id] || [];\nif (!name || arr.length >= MAX) return;\nconst next = { ...cur, [u.id]: [...arr, name] };\npersist(next);\nthis.setState({ students: next, drafts: { ...drafts, [u.id]: '' } });\n};\nreturn {\nname: u.name, city: u.city, count: fmt(list.length), full: full, isFull: full,\npct: (list.length / MAX * 100).toFixed(1) + '%', barColor: full ? '#B45309' : accent, btnBg: full ? '#94A3B8' : accent,\ndraft: drafts[u.id] || '',\nonInput: (e) => this.setState({ drafts: { ...drafts, [u.id]: e.target.value } }),\nadd: add,\nstudents: list.map((name, i) => ({ name: name, remove: () => {\nconst next = { ...students, [u.id]: list.filter((_, j) => j !== i) };\npersist(next);\nthis.setState({ students: next });\n} })),\n};\n});\nreturn {\naccent: accent,\nunis: unis,\nopen: open, win: win,\nclose: (e) => { if (e.target === e.currentTarget) this.setState({ win: null }); },\ncloseBtn: () => this.setState({ win: null }),\nnotesUp: mkUp('notes'), projUp: mkUp('proj'),\nwins: wDefs.map((d) => ({ icon: d[1], title: d[2], desc: d[3], open: open[d[0]] })),\nuni: {\nopen: uniIsOpen,\no: uniIsOpen ? '1' : '0',\nv: uniIsOpen ? 'visible' : 'hidden',\nt: uniIsOpen ? 'translateY(0) scale(1)' : 'translateY(-10px) scale(0.96)',\narrow: uniIsOpen ? 'rotate(180deg)' : 'rotate(0deg)',\nio: uniIsOpen ? '1' : '0',\nit: uniIsOpen ? 'translateY(0)' : 'translateY(-8px)',\n},\ntoggleUni: () => this.setState({ uniOpen: !uniIsOpen }),\ncloseUni: () => this.setState({ uniOpen: false }),\nsizes: sizes.map((s) => ({\nlabel: fmt(s),\nbg: s === n ? '#0B1220' : '#FFFFFF',\nfg: s === n ? '#FFFFFF' : '#0B1220',\nbd: s === n ? '#0B1220' : '#B8C4D6',\npressed: s === n,\npick: () => this.setState({ n: s }),\n})),\nrows: [\n{ name: 'O(log n)', label: 'جست‌وجوی دودویی', count: fmt(lg), w: w(lg), color: accent },\n{ name: 'O(n)', label: 'جست‌وجوی خطی', count: fmt(n), w: w(n), color: accent },\n{ name: 'O(n log n)', label: 'مرتب‌سازی ادغامی', count: fmt(n * lg), w: w(n * lg), color: accent },\n{ name: 'O(n²)', label: 'مرتب‌سازی حبابی', count: fmt(max), w: w(max), color: '#0B1220' },\n],\n};\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
